<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alvaro Velame — Desenvolvedor Full Stack</title>
    <meta
      name="description"
      content="Portfólio de Alvaro Velame, desenvolvedor full stack. Sistemas completos com React, TypeScript, Java, C# e Node.js: AgroGestor, CtOperacional e Controle de Insumos."
    />
    <meta name="theme-color" content="#090b12" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alvaro Velame — Desenvolvedor Full Stack" />
    <meta
      property="og:description"
      content="Sistemas completos do frontend ao deploy: React, TypeScript, Java, C# e Node.js."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio:tema');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este site precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
